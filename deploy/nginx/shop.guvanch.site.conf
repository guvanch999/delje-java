# nginx site for https://shop.guvanch.site
# Copy to /etc/nginx/sites-available/, enable, then let certbot add the certificate:
#   sudo ln -s /etc/nginx/sites-available/shop.guvanch.site.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d shop.guvanch.site
# certbot rewrites this file: adds "listen 443 ssl", certificate paths and the http -> https redirect.

server {
    listen 80;
    listen [::]:80;
    server_name shop.guvanch.site;

    # product form: up to 12 pictures of 8 MB each
    client_max_body_size 100m;

    access_log /var/log/nginx/shop.guvanch.site.access.log;
    error_log /var/log/nginx/shop.guvanch.site.error.log;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
