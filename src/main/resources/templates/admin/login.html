<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title th:text="${title != null ? title : 'Вход'}">Вход</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
    }
    .login-card {
      width: 100%;
      max-width: 360px;
      padding: 32px;
      background: #1e293b;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
    }
    .login-card h1 {
      margin: 0 0 24px;
      font-size: 20px;
      text-align: center;
    }
    .field { margin-bottom: 16px; }
    .field label {
      display: block;
      margin-bottom: 6px;
      font-size: 13px;
      color: #94a3b8;
    }
    .field input {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #334155;
      border-radius: 8px;
      background: #0f172a;
      color: #e2e8f0;
      font-size: 14px;
    }
    .field input:focus {
      outline: none;
      border-color: #d6409f;
    }
    button {
      width: 100%;
      padding: 11px;
      border: none;
      border-radius: 8px;
      background: #d6409f;
      color: #fff;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover { background: #b02b82; }
    .error {
      margin: 0 0 16px;
      padding: 10px 12px;
      border-radius: 8px;
      background: #7f1d1d;
      color: #fecaca;
      font-size: 13px;
      text-align: center;
    }
  </style>
</head>
<body>
  <form class="login-card" method="post" th:action="@{/admin/login}">
    <h1>Вход в админку</h1>
    <p th:if="${error != null}" class="error" th:text="${error}"></p>
    <div class="field">
      <label for="login">Логин</label>
      <input type="text" id="login" name="login" autocomplete="username" autofocus required />
    </div>
    <div class="field">
      <label for="password">Пароль</label>
      <input type="password" id="password" name="password" autocomplete="current-password" required />
    </div>
    <button type="submit">Войти</button>
  </form>
</body>
</html>
