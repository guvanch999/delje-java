<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/admin}">
<body>
<th:block layout:fragment="content">
<div class="toolbar">
  <h1>Категории</h1>
  <a class="btn btn--primary" href="/admin/categories/new">Добавить категорию</a>
</div>

<div th:if="${categories.isEmpty()}" class="empty">Категорий пока нет.</div>
<table th:unless="${categories.isEmpty()}" class="list">
  <thead>
    <tr>
      <th>Название</th>
      <th>Slug</th>
      <th style="width: 220px;">Действия</th>
    </tr>
  </thead>
  <tbody>
    <tr th:each="c : ${categories}">
      <td th:text="${c.name}"></td>
      <td class="muted" th:text="${c.slug}"></td>
      <td>
        <div class="actions">
          <a class="btn btn--secondary btn--sm" th:href="|/admin/categories/${c.id}/edit|">Изменить</a>
          <form class="inline-form" method="post" th:action="|/admin/categories/${c.id}/delete|"
                th:data-confirm="|Удалить категорию «${c.name}»?|">
            <button type="submit" class="btn btn--danger btn--sm">Удалить</button>
          </form>
        </div>
      </td>
    </tr>
  </tbody>
</table>
</th:block>
</body>
</html>
