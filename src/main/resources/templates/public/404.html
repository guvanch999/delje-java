<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/main}">
<body>
<th:block layout:fragment="content">
<section class="page container error-page">
  <p class="error-page__code">404</p>
  <h1 th:text="#{notFound.title}"></h1>
  <p class="muted" th:text="#{notFound.text}"></p>
  <div class="error-page__actions">
    <a th:href="|/${lang}|" class="btn btn--primary" th:text="#{notFound.home}"></a>
    <a th:href="|/${lang}/products|" class="btn btn--ghost" th:text="#{notFound.catalog}"></a>
  </div>
</section>
</th:block>
</body>
</html>
