<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<footer th:fragment="footer" class="site-footer">
  <div class="container site-footer__inner">
    <div class="site-footer__col">
      <a class="brand" th:href="|/${lang}|" th:aria-label="#{brand.aria}">
        <img class="brand__logo" src="/static/favicon.svg" alt="" width="40" height="40" />
        <span class="brand__word">DELJE</span>
      </a>
      <p class="muted" th:text="#{footer.tagline}"></p>
      <a class="site-footer__ig" href="https://instagram.com/delje_brand" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1.2" fill="currentColor" stroke="none"/></svg>
        @delje_brand
      </a>
    </div>
    <nav class="site-footer__col" th:aria-label="#{footer.navAria}">
      <h3 th:text="#{footer.sections}"></h3>
      <ul>
        <li><a th:href="|/${lang}|" th:text="#{nav.home}"></a></li>
        <li><a th:href="|/${lang}/products|" th:text="#{nav.catalog}"></a></li>
        <li><a th:href="|/${lang}/about|" th:text="#{nav.about}"></a></li>
        <li><a th:href="|/${lang}/contact|" th:text="#{nav.contact}"></a></li>
      </ul>
    </nav>
    <div class="site-footer__col">
      <h3 th:text="#{footer.contacts}"></h3>
      <ul>
        <li><a href="tel:+99312000000">+993 12 00-00-00</a></li>
        <li><a href="mailto:info@example.com">info@example.com</a></li>
      </ul>
    </div>
  </div>
  <div class="container site-footer__bottom">
    <p class="muted">© <th:block th:text="${#dates.year(#dates.createNow())}"></th:block> DELJE. <th:block th:text="#{footer.rights}"></th:block></p>
  </div>
</footer>
</body>
</html>
