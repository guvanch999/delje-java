<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      th:lang="${lang}"
      th:with="pageTitle=${title != null and title != '' ? title : #messages.msg('layout.defaultTitle')}">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title th:text="${pageTitle}">DELJE</title>
  <meta th:if="${metaDescription != null and metaDescription != ''}" name="description" th:content="${metaDescription}" />

  <!-- Canonical + language alternates -->
  <link rel="canonical" th:href="${canonicalUrl}" />
  <link th:each="alt : ${hreflangs}" rel="alternate" th:hreflang="${alt.lang}" th:href="${alt.href}" />
  <link rel="alternate" hreflang="x-default" th:href="${hreflangs[0].href}" />

  <meta name="theme-color" content="#0f0b14" />
  <!-- Theme before first paint: dark by default, light when chosen -->
  <script>
    (function () {
      try {
        if (localStorage.getItem('theme') === 'light') {
          document.documentElement.setAttribute('data-theme', 'light');
          var m = document.querySelector('meta[name="theme-color"]');
          if (m) m.content = '#faf7fc';
        }
      } catch (e) {}
    })();
  </script>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml" />

  <!-- Open Graph -->
  <meta property="og:type" content="website" />
  <meta property="og:locale" th:content="${lang == 'ru' ? 'ru_RU' : 'tk_TM'}" />
  <meta property="og:title" th:content="${pageTitle}" />
  <meta th:if="${metaDescription != null and metaDescription != ''}" property="og:description" th:content="${metaDescription}" />
  <meta property="og:url" th:content="${canonicalUrl}" />
  <meta property="og:image" th:content="${siteUrl + '/static/og-default.svg'}" />

  <!-- Fonts: Unbounded (display) + Inter (text), with Cyrillic -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Unbounded:wght@600;700;800&display=swap"
  />

  <link rel="stylesheet" href="/static/css/style.css" />
</head>
<body>
  <div class="bg-decor" aria-hidden="true"><span></span><span></span><span></span></div>
  <header th:replace="~{fragments/header :: header}"></header>
  <main class="site-main">
    <th:block layout:fragment="content"></th:block>
  </main>
  <footer th:replace="~{fragments/footer :: footer}"></footer>

  <button class="to-top" type="button" th:aria-label="#{layout.toTop}">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M12 19V5M5 12l7-7 7 7" />
    </svg>
  </button>

  <!-- Localized strings for client scripts (slide aria-labels) -->
  <script th:inline="javascript">window.__I18N = { slide: /*[[#{home.slideLabel}]]*/ 'Slide' };</script>
  <script defer src="/static/js/main.js"></script>
</body>
</html>
