<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title th:text="${status != null ? status : 'Error'}">Error</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: #0f0b14;
      color: #e8e2f0;
      text-align: center;
    }
    .code { font-size: 64px; font-weight: 800; margin: 0; color: #d6409f; }
    a { color: #e8e2f0; }
  </style>
</head>
<body>
  <main>
    <p class="code" th:text="${status != null ? status : 500}">500</p>
    <p th:if="${status == 403}">Доступ запрещён. Обновите страницу и попробуйте ещё раз.<br />Rugsat ýok. Sahypany täzeläp, täzeden synanyşyň.</p>
    <p th:unless="${status == 403}">Что-то пошло не так. Попробуйте позже.<br />Bir näsazlyk ýüze çykdy. Soňrak synanyşyň.</p>
    <p><a href="/">DELJE</a></p>
  </main>
</body>
</html>
